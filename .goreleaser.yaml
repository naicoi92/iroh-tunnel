# GoReleaser config — LINUX pipeline (ADR-0002).
#
# Run on an ubuntu runner. Produces:
#   - Release binaries for linux/amd64 + linux/arm64 (via cargo-zigbuild)
#   - Checksums file
#   - .deb (glibc) + .apk (musl) Linux packages (via nFPM). The .apk targets
#     Alpine/musl hosts (LXC, bare-metal), so it is built from a separate
#     *-unknown-linux-musl target; the .deb + Docker image stay on glibc.
#   - Multi-arch Docker image on ghcr.io (via dockers_v2 + buildx)
#   - The GitHub Release itself (this job owns the release; the macOS job appends).
#
# The macOS (darwin/arm64) binary + Homebrew cask are built by a separate config
# (`.goreleaser.macos.yaml`) on a macos runner, because iroh's dependency on
# macOS frameworks (SystemConfiguration/CoreFoundation) cannot be cross-compiled
# from Linux (see IROHTUN-42 review notes).
#
# The app version is resolved from the git tag at build time by build.rs
# (ADR-0003 / IROHTUN-40); GoReleaser does not need to inject it.
#
# Out of scope (deferred): AUR, .rpm, macOS Intel, Trivy/SBOM, Cosign signing.

version: 2

project_name: iroh-tunnel

before:
  hooks:
    # Fast local checks; fail fast on obvious mistakes before the long builds.
    - cargo check --release
    - cargo fmt -- --check

builds:
  # glibc build — feeds the .deb package and the Docker image. Targets any
  # standard glibc distro (Debian/Ubuntu/Fedora/...).
  - id: iroh-tunnel
    builder: rust
    binary: iroh-tunnel
    env:
      # Statically link PCRE2 for the `regex` crate so binaries are portable
      # across distros without a libpcre2(-8) shared library at runtime.
      - PCRE2_SYS_STATIC=1
    targets:
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    flags:
      - --release

  # musl build — feeds the .apk package only. Required for Alpine hosts
  # (LXC, bare-metal), which use musl libc and cannot run a glibc binary
  # (missing /lib/ld-linux-*.so.* dynamic linker). cargo-zigbuild ships a
  # musl sysroot via zig, so no extra musl-tools install is needed on the CI
  # runner (ADR-0002 §2: zig 0.13.0 already set up by release.yml).
  - id: iroh-tunnel-musl
    builder: rust
    binary: iroh-tunnel
    env:
      - PCRE2_SYS_STATIC=1
    targets:
      - x86_64-unknown-linux-musl
      - aarch64-unknown-linux-musl
      # NanoKVM / embedded riscv64 (buildroot, musl). Build path verified by
      # the v0.1.4 spike (ring 0.17.14 compiles for riscv64 with zig 0.13 +
      # cargo-zigbuild); the CI snapshot run rehearses the target before any
      # tag goes out.
      - riscv64gc-unknown-linux-musl
    flags:
      - --release

# Two archive blocks because we now ship two linux libc flavours (glibc + musl);
# without filtering by build `ids` both would emit `...-linux-<arch>.tar.gz` and
# collide. The musl tarball is tagged `-musl` so Alpine users can pick it.
archives:
  - id: glibc
    ids:
      - iroh-tunnel
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE*
  - id: musl
    ids:
      - iroh-tunnel-musl
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}-musl"
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# ---- Linux packages via nFPM ----
# Two blocks because the .deb and .apk need different libc flavours:
#   - .deb from the glibc build (iroh-tunnel)  → Debian/Ubuntu/Fedora/...
#   - .apk from the musl build (iroh-tunnel-musl) → Alpine (LXC, bare-metal)
# Both share the same package_name, contents (systemd unit + config dir) and
# postinstall script. Architectures are inferred from each build's targets
# (amd64, arm64).
nfpms:
  # glibc → .deb
  - id: iroh-tunnel
    package_name: iroh-tunnel
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: naicoi92
    homepage: https://github.com/naicoi92/iroh-tunnel
    maintainer: naicoi92 <naicoi@lttech.vn>
    description: "P2P port-forwarding tunnel (TCP/UDP) via Iroh."
    license: "MIT OR Apache-2.0"
    formats:
      - deb
    ids:
      - iroh-tunnel
    contents:
      # systemd unit for the `serve` role, installed by the package.
      - src: packaging/iroh-tunnel.service
        dst: /usr/lib/systemd/system/iroh-tunnel.service
        type: config|noreplace
      # Default config directory; the binary reads /etc/iroh-tunnel/serve.toml.
      - dst: /etc/iroh-tunnel
        type: dir
    scripts:
      postinstall: packaging/postinstall.sh

  # musl → .apk (Alpine)
  - id: iroh-tunnel-musl
    package_name: iroh-tunnel
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    vendor: naicoi92
    homepage: https://github.com/naicoi92/iroh-tunnel
    maintainer: naicoi92 <naicoi@lttech.vn>
    description: "P2P port-forwarding tunnel (TCP/UDP) via Iroh."
    license: "MIT OR Apache-2.0"
    formats:
      - apk
    ids:
      - iroh-tunnel-musl
    contents:
      - src: packaging/iroh-tunnel.service
        dst: /usr/lib/systemd/system/iroh-tunnel.service
        type: config|noreplace
      - dst: /etc/iroh-tunnel
        type: dir
    scripts:
      postinstall: packaging/postinstall.sh

# ---- Docker: multi-arch -> ghcr.io via buildx (no QEMU) ----
# buildx is the default; no `use:` field. The Dockerfile copies the prebuilt
# binaries GoReleaser stages at $TARGETPLATFORM/<binary>.
dockers_v2:
  - id: iroh-tunnel-ghcr
    images:
      - ghcr.io/naicoi92/iroh-tunnel
    dockerfile: Dockerfile.goreleaser
    # Pin to the glibc build only: the musl build (iroh-tunnel-musl) also
    # produces a binary at linux/amd64/iroh-tunnel, so without this the staged
    # build context would be ambiguous. The distroless base image is glibc.
    ids:
      - iroh-tunnel
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Tag }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "v{{ .Major }}"
      - "{{ .Version }}"
      - latest
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.licenses: "MIT OR Apache-2.0"
    # Trivy/SBOM scanning is deferred beyond v0.1.0.
    sbom: false

release:
  github:
    owner: naicoi92
    name: iroh-tunnel
  # Publish immediately on tag push — no draft step. (Previously `draft: true`;
  # flipped to `false` so tagged releases go live without a manual publish.)
  draft: false
  prerelease: auto
  # `replace` so re-running the Linux job overwrites its own artifacts cleanly;
  # the macOS job (`.goreleaser.macos.yaml`) uses `mode: append` to add its files.
  mode: replace
  name_template: "{{ .Tag }}"
  # Auto release notes are produced by `changelog.use: github` above; GoReleaser
  # 2.x dropped the separate `generate_release_notes` field.
