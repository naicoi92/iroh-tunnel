[workspace]
members = [".", "crates/host", "crates/engine"]
default-members = [".", "crates/host", "crates/engine"]
resolver = "2"

[workspace.package]
version = "0.4.3-rc.3"
edition = "2021"
rust-version = "1.91"
license = "MIT OR Apache-2.0"

# Crates shared by more than one member. Never carries `test-utils` features:
# those are forwarded explicitly (root -> engine -> iroh).
[workspace.dependencies]
anyhow = "1.0"
bytes = "1.12"
iroh = "1.4.1"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tempfile = "3.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
toml_edit = "0.25"

[package]
name = "iroh-tunnel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "P2P port-forwarding tunnel (TCP/UDP) via Iroh"
license.workspace = true

[lib]
name = "iroh_tunnel"
path = "src/lib.rs"

[[bin]]
name = "iroh-tunnel"

[[bin]]
name = "iroh-tunnel-serve"
path = "src/bin_serve.rs"

[[bin]]
name = "iroh-tunnel-access"
path = "src/bin_access.rs"

[features]
# Forwards to the host (and from there the engine): enables the insecure
# relay-TLS trust override used by integration tests (in-process relay with a
# self-signed certificate). Never enable in production builds: it disables
# relay certificate verification.
test-utils = ["iroh-tunnel-host/test-utils"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
iroh-tunnel-host = { path = "crates/host" }
tokio.workspace = true
iroh.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow.workspace = true
serde_json.workspace = true
which = "8"
edit = "0.1"

[dev-dependencies]
tempfile.workspace = true
serde.workspace = true
toml.workspace = true
bytes.workspace = true
# In-process relay server for the relay-auth integration tests.
iroh = { version = "1.4.1", features = ["test-utils"] }
# AccessControl types for the token relay in tests/relay_auth.rs.
iroh-relay = "1.4.1"
iroh-tunnel-host = { path = "crates/host", features = ["test-utils"] }
iroh-tunnel-engine = { path = "crates/engine", features = ["test-utils"] }
data-encoding = "2.11"
libc = "0.2"
sha2 = "0.11"
dirs = "6"
zip = { version = "9", default-features = false, features = ["deflate"] }

[build-dependencies]
# vergen-gitcl 9.x — inject git tag into APP_VERSION at build time.
# Pinned to 9.x: 10.x requires rustc 1.95, but this crate targets rust-version 1.91.
vergen-gitcl = { version = "9.0", features = ["build"] }
# Validate the git tag as Cargo semver before exporting it as APP_VERSION,
# so downstream packaging never receives an invalid version string.
semver = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
