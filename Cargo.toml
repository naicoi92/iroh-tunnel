[package]
name = "iroh-tunnel"
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
description = "P2P port-forwarding tunnel (TCP/UDP) via Iroh"
license = "MIT OR Apache-2.0"

[lib]
name = "iroh_tunnel"
path = "src/lib.rs"

[[bin]]
name = "iroh-tunnel"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
tokio = { version = "1.53", features = ["full"] }
iroh = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
toml_edit = "0.25"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
dirs = "6"
which = "8"
edit = "0.1"
data-encoding = "2.11"
regex = "1.13"

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
# vergen-gitcl 9.x — inject git tag into APP_VERSION at build time.
# Pinned to 9.x: 10.x requires rustc 1.95, but this crate targets rust-version 1.91.
vergen-gitcl = { version = "9.0", features = ["build"] }
# Validate the git tag as Cargo semver before exporting it as APP_VERSION,
# so downstream packaging never receives an invalid version string.
semver = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3
