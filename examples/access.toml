# Example access config for the docker-compose demo.
#
# This dials the serve node from examples/serve.toml (whose throwaway demo key
# has NodeId e8bb34671b11ca03ca88f7f8b500b07ab3086be8cfd168b3d041d3f478837de9)
# and exposes the tunneled `web` service on 0.0.0.0:8080 (the compose maps that
# to 127.0.0.1:8080 on the host).
#
# To use your OWN serve node instead, paste its printed NodeId into `node_id`
# below.

[node]
relay_urls = []
# relay_token = "<token>"   # only when your relay enforces access.shared_token
                            # (docs/self-hosted-relay.md — one token for every
                            # relay in relay_urls; ignored by open relays)

[[services]]
name = "web"
node_id = "e8bb34671b11ca03ca88f7f8b500b07ab3086be8cfd168b3d041d3f478837de9"
protocol = "tcp"
host = "0.0.0.0"
port = 8080
multiplex = true    # one shared connection per service (see README Multiplexing)

# Per-service relay override: dial THIS service's peer through its own relay
# set instead of [node] relay_urls (empty service list falls back to the
# node's). The serve peer must itself be registered on those relays.
#
# [[services]]
# name = "db"
# node_id = "<serve-node-id>"
# protocol = "tcp"
# host = "127.0.0.1"
# port = 5433
# relay_urls = ["https://relay.example.com"]
