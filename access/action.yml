name: iroh-tunnel
description: Reach a remote service through an iroh-tunnel Serve node by opening a local TCP or UDP port on the runner.
branding:
  icon: link
  color: blue
inputs:
  name:
    description: Name of the service to reach; must match the service name on the Serve side.
    required: true
  node-id:
    description: NodeId of the Serve node to connect to.
    required: true
  listen:
    description: Local address to listen on, as host:port (for example 127.0.0.1:8080).
    required: true
  protocol:
    description: Service protocol, tcp or udp.
    required: false
    default: tcp
  relay-url:
    description: Relay server URLs, one https:// URL per line; empty uses the n0 public relays.
    required: false
    default: ""
  relay-token:
    description: Relay authentication token; pass it from a secret.
    required: false
    default: ""
  version:
    description: iroh-tunnel release to run (X.Y.Z, vX.Y.Z, with an optional -pre suffix, or latest); empty uses the version this action was built for.
    required: false
    default: ""
  job-status:
    description: Internal; do not set.
    required: false
    default: ${{ job.status }}
outputs:
  node-id:
    description: NodeId of this Access node.
runs:
  using: node24
  main: dist/main.js
  post: dist/post.js
  post-if: always()
