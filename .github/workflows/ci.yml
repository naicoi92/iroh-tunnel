# CI pipeline — fast checks on every pull request.
#
# Two lightweight jobs run IN PARALLEL (no dependency between them) to minimize
# wall-clock time on PRs:
#   - lint:  cargo fmt --check + cargo clippy (catches style + correctness issues)
#   - test:  cargo test (unit/integration tests)
#
# Heavy artifact builds (GoReleaser snapshots, Docker, packages) live in
# snapshot.yml and only run on push to main, not on PRs. Real releases on tag
# pushes live in release.yml.

name: ci

on:
  pull_request:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # lint: format check + clippy. Cheap, fast, fail-fast on style issues.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Report both platforms on a failure instead of cancelling the sibling:
      # a Windows-only lint break should not hide the Linux result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # sccache wraps rustc to cache compilation output across runs. Set at job
      # level so every `cargo` invocation (fmt/clippy/build) is covered.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      # persist-credentials: false hardens PR-triggered jobs: this workflow only
      # reads source (contents: read), so GITHUB_TOKEN should not be persisted
      # into .git/config where later steps could leak or misuse it.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned to rust-version)
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt,clippy --no-self-update
          rustup default 1.91

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      # Formatting is platform-independent; checking it once is enough.
      - name: cargo fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ---------------------------------------------------------------------------
  # test: unit + integration tests. Runs in parallel with `lint`.
  # ---------------------------------------------------------------------------
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain (pinned to rust-version)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update
          rustup default 1.91

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: cargo test
        run: cargo test --all-features
