# CI — runs on pull requests and on pushes to main.
#
# Trigger design (no wasted runner minutes):
#   - The workflow itself has NO path filter, so the `ci-ok` aggregate check
#     always reports and can be the single required status check. Path
#     filtering happens in the `changes` job instead; docs-only PRs skip every
#     heavy job and still go green.
#   - New pushes to the same PR cancel the superseded run.
#   - Pushes to main re-run the same jobs; that is what writes the Rust cache
#     that PRs and release tags restore from (see .github/actions/setup-rust).
#
# Job graph (independent jobs run in parallel):
#   changes ─┬─ checks (lint ∥ test linux ∥ test windows)
#            ├─ scripts (shellcheck + actionlint)
#            ├─ build-check (all release targets; packaging paths only)
#            │     ├─ package-check (nFPM + verify-dist.sh)   ┐ in parallel
#            │     └─ docker-check  (3 images, not pushed)    ┘
#            └─ ci-ok (required check)

name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      packaging: ${{ steps.filter.outputs.packaging }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/checks.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            packaging:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'packaging/**'
              - 'Dockerfile.goreleaser*'
              - '.github/workflows/build.yml'
              - '.github/workflows/package.yml'
              - '.github/workflows/docker.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            scripts:
              - '**/*.sh'
              - '.github/**'

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      windows: true

  # Rehearses the release build (native matrix + deb/apk) only when something
  # that can break it changed. Artifacts are not published.
  build-check:
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    uses: ./.github/workflows/build.yml

  # package-check and docker-check only need the build artifacts, so they run
  # in parallel with each other.
  package-check:
    needs: build-check
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.build-check.outputs.version }}

  docker-check:
    needs: build-check
    uses: ./.github/workflows/docker.yml
    with:
      push: false
      version: ${{ needs.build-check.outputs.version }}

  # Static checks for shell scripts and workflows; seconds, no build needed.
  scripts:
    name: scripts (shellcheck + actionlint)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, checks, scripts, build-check, package-check, docker-check]
    runs-on: ubuntu-latest
    steps:
      # `skipped` is fine (path filter); `failure` / `cancelled` is not.
      - name: Verify upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
