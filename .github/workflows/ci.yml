# Pull-request CI — the test gate. Fast feedback only; no artifact builds.
#
#   changes ─┬─ lint          (fmt + clippy)                  if code changed
#            ├─ unit (linux|macos|windows)
#            │                (--lib --bins + doctests)       if code changed
#            ├─ e2e (linux|macos|windows)
#            │                (tests/*; windows adds the Task Scheduler
#            │                 step, linux a self-hosted iroh-relay
#            │                 container)                     if code changed
#            ├─ scripts       (shellcheck + actionlint + PSScriptAnalyzer)
#            │                                                if scripts/workflows changed
#            └─ ci-ok         (single required check; always reports)
#
# Release build, packages and images are NOT run on PRs. They run only on `v*`
# tags (release.yml); cache.yml warms caches on main. There is no pre-merge
# rehearsal.
#
# The workflow itself has no path filter so `ci-ok` always reports: a docs-only
# PR skips every heavy job and still goes green. New pushes to a PR cancel the
# superseded run.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      # No checkout: on pull_request events the filter reads the changed files
      # through the API.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'crates/**'
              - 'tests/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            scripts:
              - '**/*.sh'
              - 'install.ps1'
              - '.github/**'

  lint:
    name: lint (fmt + clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  unit:
    name: unit (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: unit
      - run: cargo test --workspace --all-features --locked --lib --bins
      - run: cargo test --workspace --all-features --locked --doc

  e2e:
    name: e2e (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e
      - run: cargo test --workspace --all-features --locked --test '*'
      - name: Service lifecycle (Task Scheduler)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          IROH_TUNNEL_E2E_SERVICE: "1"
        run: cargo test --all-features --locked --test service_user_windows -- --nocapture --test-threads=1
      # The image tag must match the `iroh` version in Cargo.lock.
      - name: Start self-hosted relay
        if: ${{ !cancelled() && matrix.name == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          relay="$RUNNER_TEMP/relay"
          mkdir -p "$relay/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=localhost \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$relay/certs/default.key" -out "$relay/certs/default.crt"
          cat > "$relay/config.toml" <<'EOF'
          enable_relay = true
          http_bind_addr = "0.0.0.0:3340"
          enable_quic_addr_discovery = false
          enable_metrics = false
          [tls]
          https_bind_addr = "0.0.0.0:3443"
          cert_mode = "Manual"
          cert_dir = "/certs"
          EOF
          # Throwaway key: readable regardless of the container uid.
          chmod 755 "$relay/certs"
          chmod 644 "$relay/certs/default.crt" "$relay/certs/default.key" "$relay/config.toml"
          docker run -d --name iroh-relay -p 127.0.0.1:3443:3443 \
            -v "$relay/certs:/certs:ro" \
            -v "$relay/config.toml:/config.toml:ro" \
            n0computer/iroh-relay:v1.4.1 --config-path /config.toml
          ok=0
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' iroh-relay)" = true ] || break
            if curl -fsk https://127.0.0.1:3443/healthz >/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker ps -a; docker logs iroh-relay; exit 1; }
      - name: Relay e2e (self-hosted relay)
        if: ${{ !cancelled() && matrix.name == 'linux' }}
        env:
          IROH_TUNNEL_TEST_RELAY_URL: https://127.0.0.1:3443
        run: cargo test --workspace --all-features --locked --test serve_access_tunnel -- --ignored --test-threads=1
      - name: Stop relay
        if: ${{ always() && matrix.name == 'linux' }}
        shell: bash
        run: |
          docker logs iroh-relay || true
          docker rm -f iroh-relay || true

  # Static checks for shell scripts and workflows; seconds, no build needed.
  scripts:
    name: scripts (shellcheck + actionlint + PSScriptAnalyzer)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -EnableExit

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, unit, e2e, scripts]
    runs-on: ubuntu-latest
    steps:
      # `skipped` is fine (path filter); `failure` / `cancelled` is not.
      - name: Verify upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
