# Pull-request CI — the test gate. Fast feedback only; no artifact builds.
#
#   changes ─┬─ lint          (fmt + clippy)                  if code changed
#            ├─ unit (linux|macos|windows)
#            │                (--lib --bins + doctests)       if code changed
#            ├─ scripts       (shellcheck + actionlint + PSScriptAnalyzer)
#            │                                                if scripts/workflows changed
#            └─ ci-ok         (single required check; always reports)
#
# e2e tests are NOT run on PRs: they run on every push to main (e2e.yml) and
# gate releases. Release build, packages and images run only on `v*` tags
# (release.yml); cache.yml warms caches on main. There is no pre-merge
# rehearsal.
#
# The workflow itself has no path filter so `ci-ok` always reports: a docs-only
# PR skips every heavy job and still goes green. New pushes to a PR cancel the
# superseded run.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      # No checkout: on pull_request events the filter reads the changed files
      # through the API.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'crates/**'
              - 'tests/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            scripts:
              - '**/*.sh'
              - 'install.ps1'
              - '.github/**'

  lint:
    name: lint (fmt + clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  unit:
    name: unit (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: unit
      - run: cargo test --workspace --all-features --locked --lib --bins
      - run: cargo test --workspace --all-features --locked --doc


  # Static checks for shell scripts and workflows; seconds, no build needed.
  scripts:
    name: scripts (shellcheck + actionlint + PSScriptAnalyzer)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -EnableExit

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, unit, scripts]
    runs-on: ubuntu-latest
    steps:
      # `skipped` is fine (path filter); `failure` / `cancelled` is not.
      - name: Verify upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
