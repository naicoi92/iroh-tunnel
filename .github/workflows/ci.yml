# Pull-request CI — the test gate. Fast feedback only; no artifact builds.
#
#   changes ─┬─ lint          (fmt + clippy)                  if code changed
#            ├─ test-linux    (cargo test)                    if code changed
#            ├─ test-windows  (cargo test + Task Scheduler)   if code changed
#            ├─ scripts       (shellcheck + actionlint + PSScriptAnalyzer)
#            │                                                if scripts/workflows changed
#            └─ ci-ok         (single required check; always reports)
#
# Release build matrix, packages and images are NOT run on PRs. They run after
# merge (snapshot.yml, push to main) and on tags (release.yml). To rehearse
# them on a branch, run the `snapshot` workflow manually.
#
# The workflow itself has no path filter so `ci-ok` always reports: a docs-only
# PR skips every heavy job and still goes green. New pushes to a PR cancel the
# superseded run.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      # No checkout: on pull_request events the filter reads the changed files
      # through the API.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'crates/**'
              - 'tests/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            scripts:
              - '**/*.sh'
              - 'install.ps1'
              - '.github/**'

  lint:
    name: lint (fmt + clippy)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache-key: lint
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  test-linux:
    name: test (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - run: cargo test --workspace --all-features --locked

  test-windows:
    name: test (windows)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: test
      - run: cargo test --workspace --all-features --locked
      - name: Service lifecycle (Task Scheduler)
        shell: pwsh
        env:
          IROH_TUNNEL_E2E_SERVICE: "1"
        run: cargo test --all-features --locked --test service_user_windows -- --nocapture --test-threads=1

  # Static checks for shell scripts and workflows; seconds, no build needed.
  scripts:
    name: scripts (shellcheck + actionlint + PSScriptAnalyzer)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          Invoke-ScriptAnalyzer -Path install.ps1 -Severity Warning,Error -EnableExit

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, lint, test-linux, test-windows, scripts]
    runs-on: ubuntu-latest
    steps:
      # `skipped` is fine (path filter); `failure` / `cancelled` is not.
      - name: Verify upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
