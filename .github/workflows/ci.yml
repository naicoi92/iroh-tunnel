# Pull-request CI — fast feedback only. No artifact builds here.
#
#   changes ─┬─ checks  (fmt ∥ clippy ∥ test linux ∥ test windows)  if code changed
#            ├─ scripts (shellcheck + actionlint)                   if scripts/workflows changed
#            └─ ci-ok   (single required check; always reports)
#
# The release build matrix, packages and images are NOT run on PRs. They run
# after merge (snapshot.yml, push to main) and on tags (release.yml). To
# rehearse them on a branch before merging, run the `snapshot` workflow manually
# (Actions → snapshot → Run workflow, or `gh workflow run snapshot.yml --ref <branch>`).
#
# The workflow itself has no path filter so `ci-ok` always reports: a docs-only
# PR skips every heavy job and still goes green. New pushes to a PR cancel the
# superseded run.

name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      # No checkout: on pull_request events the filter reads the changed files
      # through the API.
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'build.rs'
              - 'install.sh'
              - 'install.ps1'
              - '.github/workflows/checks.yml'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'
            scripts:
              - '**/*.sh'
              - '.github/**'

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/checks.yml
    with:
      windows: true

  # Static checks for shell scripts and workflows; seconds, no build needed.
  scripts:
    name: scripts (shellcheck + actionlint)
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git ls-files -z '*.sh' | xargs -0 shellcheck --severity=warning
      - name: actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color

  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, checks, scripts]
    runs-on: ubuntu-latest
    steps:
      # `skipped` is fine (path filter); `failure` / `cancelled` is not.
      - name: Verify upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
