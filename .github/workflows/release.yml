# Release pipeline — on a `v*` tag push builds, signs and VERIFIES the real
# artifacts and uploads them to a DRAFT release (ADR-0002, issue #100).
# Nothing becomes public here: publishing the release, the Homebrew cask and the
# images is `promote.yml`, run by hand only after the final #97 evidence exists.
#
# Building is native + parallel (build.yml), packaging is standalone nFPM, and
# the checksums are signed keyless with cosign (Sigstore) by THIS workflow, so
# the certificate identity is
#   https://github.com/naicoi92/iroh-tunnel/.github/workflows/release.yml@refs/tags/<tag>
# issuer https://token.actions.githubusercontent.com — what `update` pins.
#
#   gate (fmt ∥ clippy ∥ test) ──────────────────────────────┐
#   build (8 targets ∥) ─┬─ package ─ sign ─ verify ─ draft ──┘
#                        └─ docker (rehearsal, not pushed)
#
# `verify` runs the shipped SigstoreVerifier (#95) on the signed files, incl.
# wrong identity, changed payload and missing/invalid material.
# Re-running (workflow_dispatch on a tag ref or "Re-run jobs") replaces the
# assets of an existing DRAFT; a published release is never modified.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Safety net run in parallel with the build (no wall-clock cost). Windows is
  # skipped: the tagged commit already passed the full PR matrix.
  gate:
    uses: ./.github/workflows/checks.yml
    with:
      windows: false

  build:
    uses: ./.github/workflows/build.yml

  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.build.outputs.version }}

  # Image rehearsal only: pushing to ghcr.io is public promotion and is not
  # done by a tag (docs/design/issue-100-evidence.md, open decision).
  docker:
    needs: [gate, build]
    uses: ./.github/workflows/docker.yml
    with:
      push: false
      version: ${{ needs.build.outputs.version }}
    permissions:
      contents: read

  # Checksums and keyless signatures. This is the only job with `id-token`, and
  # it runs release.yml itself (not a reusable workflow), so the certificate
  # identity is exactly
  #   https://github.com/naicoi92/iroh-tunnel/.github/workflows/release.yml@refs/tags/<tag>
  # which is what the updater pins (src/update.rs, #95).
  sign:
    name: checksums + keyless signature
    needs: [gate, build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: in/
      - uses: actions/download-artifact@v4
        with:
          pattern: packages*
          path: dist/
          merge-multiple: true

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          cp in/*/*.tar.gz in/*/*.zip dist/
          cd dist
          # Linux and Windows archives + packages, and darwin on its own.
          sha256sum ./*.tar.gz ./*.zip ./*.deb ./*.apk | grep -v -- '-darwin-' | sed 's# \./# #' > checksums.txt
          sha256sum ./*-darwin-*.tar.gz | sed 's# \./# #' > checksums-darwin.txt
          cat checksums.txt checksums-darwin.txt

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      # Keyless: the certificate is issued to this workflow run's OIDC token and
      # logged in the Sigstore transparency log. The bundle is the verification
      # material the updater fetches as <checksums file>.sigstore.json.
      - name: Sign checksums (keyless)
        working-directory: dist
        run: |
          for f in checksums.txt checksums-darwin.txt; do
            cosign sign-blob --yes --new-bundle-format \
              --bundle "$f.sigstore.json" "$f"
          done

      - name: Verify the complete artifact set
        run: packaging/verify-release-set.sh dist "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-set
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # Verifies the REAL signed artifacts with the verifier the updater ships
  # (SigstoreVerifier, #95): pinned issuer and exact identity of this run, plus
  # wrong identity, changed payload and missing/invalid material.
  verify:
    name: verify signed artifacts
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_DIST: ${{ github.workspace }}/release-set
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-verify
      - uses: actions/download-artifact@v4
        with:
          name: release-set
          path: release-set/
      - name: Verify with the shipped verifier
        run: |
          cargo test --locked --test release_artifacts -- --ignored --nocapture --test-threads=1 \
            | tee "$RUNNER_TEMP/verify.log"
          {
            echo "### Signed release set \`$RELEASE_TAG\`"
            echo "Issuer \`https://token.actions.githubusercontent.com\`, identity" \
                 "\`https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/$RELEASE_TAG\`"
            echo
            echo '```'
            grep '^sha256:' "$RUNNER_TEMP/verify.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Uploads to a DRAFT and stops. Publishing is `promote.yml`, run only after
  # the final #97 evidence exists; nothing public changes here.
  draft:
    name: upload draft release
    needs: [gate, build, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-set
          path: dist/

      # Draft first so a half-uploaded release is never visible. Re-running
      # replaces the assets of an existing DRAFT; a published release is never
      # modified by this workflow.
      - name: Create draft release and upload assets
        run: |
          if gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "release $TAG is already published; refusing to modify it" >&2
            exit 1
          fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.digest)  \(.name)"' | sort -k2 >> "$GITHUB_STEP_SUMMARY"

