# Unified release pipeline for iroh-tunnel (ADR-0002).
#
# Two parallel pipelines, each with a release + snapshot job:
#
#   Linux (ubuntu-latest, .goreleaser.yaml):
#     binaries for linux/amd64 + linux/arm64 (cargo-zigbuild), checksums,
#     .deb/.apk (nFPM), Docker image on ghcr.io (buildx multi-arch), and the
#     GitHub Release itself.
#
#   macOS (macos-14, .goreleaser.macos.yaml):
#     binary for darwin/arm64 (native build) + Homebrew cask. Built natively
#     because iroh depends on macOS frameworks (SystemConfiguration/
#     CoreFoundation) that cannot be cross-compiled from Linux.
#
# The macOS release job appends to the GitHub Release the Linux job created, so
# on tag pushes it `needs: release-linux`. The snapshot jobs are independent.
#
# This replaces the binary-only matrix workflow from T-14 (PR #14).

name: release

on:
  push:
    # Tag pushes trigger the release jobs; branch pushes trigger snapshots.
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux: binaries + Docker + deb/apk + owns the GitHub Release.
  # ---------------------------------------------------------------------------
  release-linux:
    name: release (linux)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned to rust-version)
        # `rustfmt` + `clippy` are needed because GoReleaser's `before.hooks`
        # run `cargo fmt -- --check` (and clippy is cheap to include).
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt,clippy --no-self-update
          rustup default 1.91

      # mlugg/setup-zig puts `zig` on PATH for subsequent steps, which
      # GoReleaser's Rust builder (cargo-zigbuild) relies on. Pinned to 0.13.0
      # to match the verified spike (ADR-0002 §2).
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo +1.91 install cargo-zigbuild --locked

      # QEMU lets buildx build the linux/arm64 image from the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (Linux)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # macOS: darwin binary + Homebrew cask. Appends to the Linux release.
  # ---------------------------------------------------------------------------
  release-macos:
    name: release (macos)
    runs-on: macos-14
    needs: release-linux
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned to rust-version)
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt,clippy --no-self-update
          rustup default 1.91

      - name: Run GoReleaser (macOS)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --config .goreleaser.macos.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Linux snapshot (no publish): runs on push/PR to catch breakage early.
  # ---------------------------------------------------------------------------
  snapshot-linux:
    name: snapshot (linux)
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned to rust-version)
        # `rustfmt` is needed because GoReleaser's `before.hooks` run
        # `cargo fmt -- --check`.
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt --no-self-update
          rustup default 1.91

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo +1.91 install cargo-zigbuild --locked

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: goreleaser snapshot (Linux)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # macOS snapshot (no publish): runs on push/PR.
  # ---------------------------------------------------------------------------
  snapshot-macos:
    name: snapshot (macos)
    runs-on: macos-14
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned to rust-version)
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt --no-self-update
          rustup default 1.91

      - name: goreleaser snapshot (macOS)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean --config .goreleaser.macos.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
