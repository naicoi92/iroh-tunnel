# Release pipeline — publishes real artifacts on a `v*` tag push (ADR-0002).
#
# GoReleaser is gone: building is native + parallel (build.yml), packaging is
# standalone nFPM, the image is assembled by buildx from prebuilt binaries, and
# the GitHub Release / Homebrew cask are plain `gh` / git steps. (GoReleaser's
# `prebuilt` builder and split/merge are Pro-only, so OSS GoReleaser cannot
# consume binaries built on separate runners.)
#
# Job graph — `gate` and `build` start together; nothing is published until
# the gate and the packages are green, so a failed build never leaves a
# half-made release. `package` and `docker` both need only the build artifacts
# and run IN PARALLEL:
#
#   gate (fmt ∥ clippy ∥ test) ───────────┬──────────────┐
#   build (6 targets ∥) ─┬─ package ──────┴→ release → homebrew
#                        └─ docker (also needs gate)
#
# Re-running (workflow_dispatch on a tag ref or "Re-run jobs") replaces the
# assets of an existing release instead of failing.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Safety net run in parallel with the build (no wall-clock cost). Windows is
  # skipped: the tagged commit already passed the full PR matrix.
  gate:
    uses: ./.github/workflows/checks.yml
    with:
      windows: false

  build:
    uses: ./.github/workflows/build.yml

  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.build.outputs.version }}

  # Images need only the glibc binaries, not the packages: start as soon as the
  # gate and the build are green.
  docker:
    needs: [gate, build]
    uses: ./.github/workflows/docker.yml
    with:
      push: true
      version: ${{ needs.build.outputs.version }}
    permissions:
      contents: read
      packages: write

  release:
    name: publish GitHub Release
    needs: [gate, build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.build.outputs.version }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: in/
      - uses: actions/download-artifact@v4
        with:
          pattern: packages*
          path: dist/
          merge-multiple: true

      - name: Collect assets and checksums
        run: |
          mkdir -p dist
          cp in/*/*.tar.gz in/*/*.zip dist/
          cd dist
          # Same split as before: Linux and Windows archives + packages, and
          # darwin on its own.
          sha256sum ./*.tar.gz ./*.zip ./*.deb ./*.apk | grep -v -- '-darwin-' | sed 's# \./# #' > checksums.txt
          sha256sum ./*-darwin-*.tar.gz | sed 's# \./# #' > checksums-darwin.txt
          cat checksums.txt checksums-darwin.txt

      # Draft first so a half-uploaded release is never visible, then publish
      # in one atomic edit once every asset is attached.
      - name: Create draft release and upload assets
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            prerelease=()
            [[ "$VERSION" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" --draft --verify-tag --title "$TAG" \
              --generate-notes "${prerelease[@]}"
          fi
          gh release upload "$TAG" dist/* --clobber

      - name: Publish release
        run: gh release edit "$TAG" --draft=false

  homebrew:
    name: update Homebrew tap
    needs: [build, release]
    # Pre-releases must not move the stable cask.
    if: ${{ !contains(needs.build.outputs.version, '-') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: target-darwin-arm64
          path: darwin/

      - name: Render cask
        run: |
          sha="$(sha256sum darwin/iroh-tunnel-"$VERSION"-darwin-arm64.tar.gz | cut -d' ' -f1)"
          mkdir -p tap-out
          bash packaging/homebrew-cask.sh "$VERSION" "$sha" > tap-out/iroh-tunnel.rb
          cat tap-out/iroh-tunnel.rb

      - name: Push to naicoi92/homebrew-tap
        run: |
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/naicoi92/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp tap-out/iroh-tunnel.rb tap/Casks/iroh-tunnel.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/iroh-tunnel.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
          else
            git commit -m "iroh-tunnel ${VERSION}"
            git push origin HEAD:main
          fi
