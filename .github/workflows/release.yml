# Release pipeline — publishes real artifacts on a `v*` tag push (ADR-0002).
#
# Two jobs, serial: Linux first (owns the GitHub Release), then macOS (appends
# the darwin binary + Homebrew cask). They live in this one file because the
# macOS job depends on the Linux job (`needs: release-linux`).
#
# Linux (ubuntu-latest, .goreleaser.yaml):
#   binaries for linux/amd64 + linux/arm64 (cargo-zigbuild), checksums,
#   .deb (glibc) + .apk (musl, for Alpine LXC/hosts) (nFPM), Docker image on
#   ghcr.io (buildx multi-arch), and the GitHub Release itself.
#
# macOS (macos-14, .goreleaser.macos.yaml):
#   binary for darwin/arm64 (native build) + Homebrew cask. Built natively
#   because iroh depends on macOS frameworks (SystemConfiguration/
#   CoreFoundation) that cannot be cross-compiled from Linux.
#
# CI-only snapshot builds (no publish) live in snapshot.yml.
#
# This replaces the binary-only matrix workflow from T-14 (PR #14).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux: binaries + Docker + deb/apk + owns the GitHub Release.
  # ---------------------------------------------------------------------------
  release-linux:
    name: release (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned to rust-version)
        # `rustfmt` + `clippy` are needed because GoReleaser's `before.hooks`
        # run `cargo fmt -- --check` (and clippy is cheap to include).
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt,clippy --no-self-update
          rustup default 1.91

      # mlugg/setup-zig puts `zig` on PATH for subsequent steps, which
      # GoReleaser's Rust builder (cargo-zigbuild) relies on. Pinned to 0.13.0
      # to match the verified spike (ADR-0002 §2).
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo +1.91 install cargo-zigbuild --locked

      # QEMU lets buildx build the linux/arm64 image from the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser (Linux)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # macOS: darwin binary + Homebrew cask. Appends to the Linux release.
  # ---------------------------------------------------------------------------
  release-macos:
    name: release (macos)
    runs-on: macos-14
    needs: release-linux
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned to rust-version)
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt,clippy --no-self-update
          rustup default 1.91

      # GoReleaser's Rust builder always invokes `cargo zigbuild` even for the
      # native target, so zig + cargo-zigbuild must be present on macOS too.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo +1.91 install cargo-zigbuild --locked

      - name: Run GoReleaser (macOS)
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean --config .goreleaser.macos.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
