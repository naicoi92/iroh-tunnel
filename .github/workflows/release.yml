# Release stage — a `v*` tag push runs the whole pipeline and ends in
# deployment (OpenSpec change optimize-ci-cd).
#
#   preflight ─ build (8 targets ∥) ─ package ─ sign + verify ─┬─ github-release
#                                                              ├─ images
#                                                              └─ homebrew
#
# preflight refuses anything but a vX.Y.Z[-pre] tag on a commit reachable from
# main whose merged PR head passed the `ci-ok` check.
#
# The checksums are signed keyless with cosign (Sigstore) by THIS workflow, so
# the certificate identity is
#   https://github.com/naicoi92/iroh-tunnel/.github/workflows/release.yml@refs/tags/<tag>
# issuer https://token.actions.githubusercontent.com — what `update` pins.
# Only the signing job may mint a Sigstore token; it runs release.yml itself
# (not a reusable workflow) so that identity stays exact.
#
# Nothing is published until sign has checked the exact asset set, signed the
# checksums and verified the bundles; the three publish jobs then run in
# parallel (homebrew waits for the GitHub Release it points at).

name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
    outputs:
      version: ${{ steps.pf.outputs.version }}
      prerelease: ${{ steps.pf.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check tag, main ancestry and ci-ok
        id: pf
        run: |
          set -euo pipefail
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$GITHUB_REF_NAME" =~ $re ]]; then
            echo "tag $GITHUB_REF_NAME is not vX.Y.Z[-pre]" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not reachable from main" >&2
            exit 1
          fi

          pr_head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.merge_commit_sha == \"$GITHUB_SHA\")][0].head.sha // empty")
          if [[ -z "$pr_head" ]]; then
            echo "no merged pull request for $GITHUB_SHA" >&2
            exit 1
          fi

          concl=$(gh api "repos/$GITHUB_REPOSITORY/commits/$pr_head/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[]] | sort_by(.completed_at) | last | .conclusion // empty')
          if [[ "$concl" != "success" ]]; then
            echo "ci-ok on $pr_head is '${concl:-missing}', expected success" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; else prerelease=false; fi
          {
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Release \`$GITHUB_REF_NAME\` (prerelease: $prerelease): PR head \`$pr_head\` passed ci-ok." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build (${{ matrix.id }})
    needs: [preflight]
    runs-on: ${{ matrix.runner }}
    # The steps below are bash; Windows runners default to PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      # One broken target fails the whole build, so stop the siblings instead of
      # burning runner minutes on a build that cannot be used.
      fail-fast: true
      matrix:
        include:
          - { id: gnu-amd64,     runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,      os: linux,  arch: amd64,   suffix: "" }
          - { id: gnu-arm64,     runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu,     os: linux,  arch: arm64,   suffix: "" }
          - { id: musl-amd64,    runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,     os: linux,  arch: amd64,   suffix: "-musl", musl: true }
          - { id: musl-arm64,    runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,    os: linux,  arch: arm64,   suffix: "-musl", musl: true }
          - { id: musl-riscv64,  runner: ubuntu-latest,    target: riscv64gc-unknown-linux-musl,  os: linux,  arch: riscv64gc, suffix: "-musl", zig: true }
          - { id: darwin-arm64,  runner: macos-15,         target: aarch64-apple-darwin,          os: darwin, arch: arm64,   suffix: "" }
          - { id: windows-amd64, runner: windows-latest,   target: x86_64-pc-windows-msvc,        os: windows, arch: amd64,  suffix: "", ext: ".exe" }
          - { id: windows-arm64, runner: windows-11-arm,   target: aarch64-pc-windows-msvc,       os: windows, arch: arm64,  suffix: "", ext: ".exe" }
    env:
      # Statically link PCRE2 for the `regex` crate so binaries are portable
      # across distros without a libpcre2 shared library at runtime.
      PCRE2_SYS_STATIC: "1"
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      # Full history: build.rs resolves APP_VERSION via `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: release-${{ matrix.id }}

      - name: Install musl toolchain
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          # cc-rs (C deps such as ring) and the final link must both use musl.
          key="${TARGET//-/_}"
          echo "CC_${key}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${key^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = "true" ]; then sub=zigbuild; else sub=build; fi
          cargo "$sub" --release --locked --target "$TARGET" --bins

      - name: Smoke test (native binaries)
        if: ${{ !matrix.zig }}
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          out="$("target/$TARGET/release/iroh-tunnel${EXT}" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || { echo "version mismatch: expected $VERSION"; exit 1; }
          for b in iroh-tunnel iroh-tunnel-serve iroh-tunnel-access; do
            "target/$TARGET/release/${b}${EXT}" --help >/dev/null
            echo "ok: $b starts on $RUNNER_OS $RUNNER_ARCH"
          done

      # One tarball per executable (issue #94); each holds only that binary.
      - name: Archive
        if: matrix.os != 'windows'
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p out
          for b in iroh-tunnel iroh-tunnel-serve iroh-tunnel-access; do
            cp "target/$TARGET/release/$b" "out/$b"
            tar -czf "out/${b}-${VERSION}-${OS}-${ARCH}${SUFFIX}.tar.gz" \
              -C out "$b" -C .. README.md LICENSE-APACHE LICENSE-MIT
          done

      # One .zip per executable (issue #124), holding only that .exe plus the
      # README and licenses, flat (no directory inside).
      - name: Archive (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($b in 'iroh-tunnel','iroh-tunnel-serve','iroh-tunnel-access') {
            $stage = "stage/$b"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "target/$env:TARGET/release/$b.exe" $stage
            Copy-Item README.md,LICENSE-APACHE,LICENSE-MIT $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "out/$b-$env:VERSION-windows-$env:ARCH.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.id }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  package:
    name: package (deb + apk)
    needs: [preflight, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: in/

      - name: Install nFPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo goreleaser/nfpm --pattern 'nfpm_*_Linux_x86_64.tar.gz' --dir /tmp/nfpm
          tar -xzf /tmp/nfpm/nfpm_*_Linux_x86_64.tar.gz -C /tmp/nfpm nfpm
          sudo install /tmp/nfpm/nfpm /usr/local/bin/nfpm

      - name: Build packages
        run: |
          mkdir -p dist
          pack() { # <artifact-id> <pkg-arch> <format> <name> <alias> <description>
            export NAME="$4" ALIAS="$5" DESCRIPTION="$6" ARCH="$2" \
              BINARY="$PWD/in/target-$1/$4"
            # nFPM does not expand env vars in file paths, so render first.
            # shellcheck disable=SC2016 # the literal ${VAR} list is envsubst's argument
            envsubst '${NAME} ${ALIAS} ${ARCH} ${BINARY} ${VERSION} ${DESCRIPTION}' \
              < packaging/nfpm.yaml > "$RUNNER_TEMP/nfpm.yaml"
            nfpm package --config "$RUNNER_TEMP/nfpm.yaml" --packager "$3" \
              --target "dist/${4}_${VERSION}_$2.$3"
          }
          while IFS=: read -r name alias desc; do
            pack gnu-amd64 amd64 deb "$name" "$alias" "$desc"
            pack gnu-arm64 arm64 deb "$name" "$alias" "$desc"
            pack musl-amd64 amd64 apk "$name" "$alias" "$desc"
            pack musl-arm64 arm64 apk "$name" "$alias" "$desc"
            pack musl-riscv64 riscv64 apk "$name" "$alias" "$desc"
          done <<'LIST'
          iroh-tunnel:it:P2P port-forwarding tunnel (TCP/UDP) via Iroh (all-in-one: Serve and Access).
          iroh-tunnel-serve:its:P2P port-forwarding tunnel (TCP/UDP) via Iroh (Serve role only).
          iroh-tunnel-access:ita:P2P port-forwarding tunnel (TCP/UDP) via Iroh (Access role only).
          LIST
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: packages-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 7

  # Checksums and keyless signatures. The only job allowed to mint a Sigstore
  # token; the certificate identity is exactly the workflow ref above, which is
  # what the updater pins (crates/host/src/update/, #95).
  sign:
    name: checksums + keyless signature
    needs: [preflight, build, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: in/
      - uses: actions/download-artifact@v4
        with:
          pattern: packages*
          path: dist/
          merge-multiple: true

      - name: Collect assets and check the exact set
        run: |
          set -euo pipefail
          cp in/*/*.tar.gz in/*/*.zip dist/

          # Expected names, built from the contract: 3 roles x (8 archives +
          # 2 .deb + 3 .apk) = 39 files, and nothing else.
          expected=()
          for role in iroh-tunnel iroh-tunnel-serve iroh-tunnel-access; do
            for t in linux-amd64 linux-arm64 linux-amd64-musl linux-arm64-musl \
                     linux-riscv64gc-musl darwin-arm64; do
              expected+=("${role}-${VERSION}-${t}.tar.gz")
            done
            for t in windows-amd64 windows-arm64; do
              expected+=("${role}-${VERSION}-${t}.zip")
            done
            for a in amd64 arm64; do expected+=("${role}_${VERSION}_${a}.deb"); done
            for a in amd64 arm64 riscv64; do expected+=("${role}_${VERSION}_${a}.apk"); done
          done
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$RUNNER_TEMP/expected.txt"
          (cd dist && printf '%s\n' *) | LC_ALL=C sort > "$RUNNER_TEMP/actual.txt"
          bad=0
          while IFS= read -r n; do echo "FAIL missing $n"; bad=1; done \
            < <(comm -23 "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt")
          while IFS= read -r n; do echo "FAIL unexpected $n"; bad=1; done \
            < <(comm -13 "$RUNNER_TEMP/expected.txt" "$RUNNER_TEMP/actual.txt")
          [[ "$bad" == 0 ]] || exit 1
          echo "asset set ok: ${#expected[@]} files"

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # Linux and Windows archives + packages, and darwin on its own.
          sha256sum ./*.tar.gz ./*.zip ./*.deb ./*.apk | grep -v -- '-darwin-' | sed 's# \./# #' > checksums.txt
          sha256sum ./*-darwin-*.tar.gz | sed 's# \./# #' > checksums-darwin.txt
          cat checksums.txt checksums-darwin.txt

      - uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.4

      # Keyless: the certificate is issued to this workflow run's OIDC token and
      # logged in the Sigstore transparency log. The bundle is the verification
      # material the updater fetches as <checksums file>.sigstore.json.
      - name: Sign checksums (keyless)
        working-directory: dist
        run: |
          set -euo pipefail
          for f in checksums.txt checksums-darwin.txt; do
            cosign sign-blob --yes --new-bundle-format \
              --bundle "$f.sigstore.json" "$f"
          done

      - name: Verify bundles and checksums
        run: |
          set -euo pipefail
          for f in checksums.txt checksums-darwin.txt; do
            test -s "dist/$f.sigstore.json"
          done
          (cd dist && sha256sum -c checksums.txt && sha256sum -c checksums-darwin.txt)
          for f in checksums.txt checksums-darwin.txt; do
            cosign verify-blob --bundle "dist/$f.sigstore.json" \
              --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              "dist/$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: release-set
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The draft exists for seconds inside this one job, so a half-uploaded release
  # is never public and releases/latest/download/* never misses an asset.
  github-release:
    name: GitHub Release
    needs: [preflight, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
      PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-set
          path: dist/

      # Recovery: if `gh release edit` fails after `create`, a draft is left
      # behind and a re-run fails with "already exists". Run
      # `gh release delete <tag>` (keep the tag), then re-run all jobs.
      - name: Create and publish the release
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; refusing to modify it" >&2
            exit 1
          fi
          args=()
          [[ "$PRERELEASE" == true ]] && args+=(--prerelease)
          gh release create "$TAG" --draft --verify-tag --title "$TAG" \
            --generate-notes "${args[@]}" dist/*
          gh release edit "$TAG" --draft=false

      # After publication, so a summary failure cannot fail the job and skip homebrew.
      - name: Asset digest summary
        continue-on-error: true
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets \
            --jq '.assets[] | "\(.digest)  \(.name)"' | sort -k2 >> "$GITHUB_STEP_SUMMARY"

  # Role images from the same glibc binaries that were checksummed and signed.
  # Nothing is compiled here; buildx only assembles layers.
  images:
    name: image (${{ matrix.image }})
    needs: [preflight, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: iroh-tunnel,        dockerfile: Dockerfile.release }
          - { image: iroh-tunnel-serve,  dockerfile: Dockerfile.release.serve }
          - { image: iroh-tunnel-access, dockerfile: Dockerfile.release.access }
    steps:
      # The Dockerfiles are the build context.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Stage binaries at $TARGETPLATFORM/<binary> (see the Dockerfiles).
      - uses: actions/download-artifact@v4
        with:
          name: target-gnu-amd64
          path: linux/amd64
      - uses: actions/download-artifact@v4
        with:
          name: target-gnu-arm64
          path: linux/arm64

      # upload-artifact zips drop file modes; the Dockerfiles COPY without --chmod.
      - name: Make binaries executable
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            for bin in iroh-tunnel iroh-tunnel-serve iroh-tunnel-access; do
              chmod +x "linux/${arch}/${bin}"
            done
          done

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/naicoi92/${{ matrix.image }}
          tags: |
            type=raw,value=v${{ needs.preflight.outputs.version }}
            type=raw,value=${{ needs.preflight.outputs.version }}
            type=semver,pattern=v{{major}}.{{minor}},value=v${{ needs.preflight.outputs.version }}
            type=semver,pattern=v{{major}},value=v${{ needs.preflight.outputs.version }}
            type=raw,value=latest,enable=${{ needs.preflight.outputs.prerelease != 'true' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      - name: Record image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: echo "ghcr.io/naicoi92/${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke the pushed image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm --platform linux/amd64 "ghcr.io/naicoi92/${IMAGE}@${DIGEST}" --help

  # Pre-releases must not move the stable cask. Needs github-release so the
  # cask never points at a release that does not exist.
  homebrew:
    name: update Homebrew tap
    needs: [preflight, github-release]
    if: ${{ needs.preflight.outputs.prerelease != 'true' }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: release-set
          path: release-set/

      - name: Render cask from the signed checksums
        run: |
          set -euo pipefail
          sha="$(awk -v n="iroh-tunnel-${VERSION}-darwin-arm64.tar.gz" '$2 == n { print $1 }' release-set/checksums-darwin.txt)"
          [[ -n "$sha" ]] || { echo "no darwin checksum for iroh-tunnel" >&2; exit 1; }
          mkdir -p tap-out
          bash packaging/homebrew-cask.sh "$VERSION" "$sha" > tap-out/iroh-tunnel.rb
          cat tap-out/iroh-tunnel.rb

      - name: Push to naicoi92/homebrew-tap
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/naicoi92/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp tap-out/iroh-tunnel.rb tap/Casks/iroh-tunnel.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/iroh-tunnel.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
          else
            git commit -m "iroh-tunnel ${VERSION}"
            git push origin HEAD:main
          fi
