# Unified release pipeline for iroh-tunnel (ADR-0002).
#
# Two jobs:
#   - `release`: runs on tag `v*` push (or manual dispatch). Builds everything
#     (binaries, .deb/.apk, Docker image, Homebrew cask) via GoReleaser and
#     publishes them.
#   - `snapshot`: runs on every other push/PR. Runs
#     `goreleaser release --snapshot --clean`, which builds all artifacts into
#     dist/ WITHOUT publishing. This catches `iroh` crate breakage and config
#     regressions early (ADR-0002 §5 risk: iroh bump breaking zigbuild).
#
# This replaces the binary-only matrix workflow from T-14 (PR #14).
#
# Notes:
#   - Rust 1.91 matches the crate `rust-version`. cargo-zigbuild is the default
#     backend for GoReleaser's `builder: rust` (spiked OK with iroh, 66s/target).
#   - QEMU is required so buildx can build the linux/arm64 Docker image from an
#     amd64 runner (the binary is already cross-compiled; QEMU is only for the
#     image build step).

name: release

on:
  push:
    # Tag pushes trigger the release job; branch pushes trigger the snapshot job.
    tags:
      - "v*"
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    # Only publish on a real tag push (or a manual run, which still goes through
    # GoReleaser and is expected to publish).
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned to rust-version)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update
          rustup default 1.91

      - name: Install Zig
        run: |
          mkdir -p $HOME/.local/bin
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            | tar -xJ --strip-components=1 -C $HOME/.local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo +1.91 install cargo-zigbuild --locked

      # QEMU lets buildx build the linux/arm64 image from the amd64 runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  snapshot:
    name: snapshot (no publish)
    runs-on: ubuntu-latest
    # Run on non-tag pushes/PRs to validate the pipeline without publishing.
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain (pinned to rust-version)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update
          rustup default 1.91

      - name: Install Zig
        run: |
          mkdir -p $HOME/.local/bin
          curl -L https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz \
            | tar -xJ --strip-components=1 -C $HOME/.local
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-zigbuild
        run: cargo +1.91 install cargo-zigbuild --locked

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: goreleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
