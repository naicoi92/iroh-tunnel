# End-to-end tests — run on every push to main, not on pull requests.
#
#   e2e (linux|macos|windows)  tests/*; windows adds the Task Scheduler step,
#                              linux a self-hosted iroh-relay container
#                              every cell then runs the GitHub Actions (./serve,
#                              ./ and ./access) with binaries built from the commit
#   e2e-action-container       Serve action inside a `container:` job (linux)
#   e2e-ok                     single result; always reports
#
# PRs run unit tests only (ci.yml). e2e runs here after merge, and the release
# preflight (release.yml) requires `e2e-ok` on the tagged commit: tag only after
# this run is green on main. There is no path filter, so every push to main
# reports `e2e-ok`. Runs for different commits are not cancelled.
#
# Before merge, run it on a branch with `gh workflow run e2e.yml --ref <branch>`
# (the branch must contain this trigger). That run reports `e2e-ok (manual)`,
# which release preflight ignores.

name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          - name: macos
            os: macos-15
          - name: windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: e2e
      - run: cargo test --workspace --all-features --locked --test '*'
      - name: Service lifecycle (Task Scheduler)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          IROH_TUNNEL_E2E_SERVICE: "1"
        run: cargo test --all-features --locked --test service_user_windows -- --nocapture --test-threads=1
      # TEMPORARY (windows-system-service Task 1 spike): removed in Task 13.
      - name: Windows trust probe (spike)
        if: matrix.name == 'windows'
        shell: pwsh
        env:
          IROH_TUNNEL_E2E_SERVICE: "1"
        run: |
          cargo test --all-features --locked --test windows_trust_probe -- --nocapture
          cargo test -p iroh-tunnel-host --all-features --locked --lib -- --nocapture trust_windows ownership:: log_file service::platform status::writer
      # The image tag must match the `iroh` version in Cargo.lock.
      - name: Start self-hosted relay
        if: ${{ !cancelled() && matrix.name == 'linux' }}
        shell: bash
        run: |
          set -euo pipefail
          relay="$RUNNER_TEMP/relay"
          mkdir -p "$relay/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=localhost \
            -addext "subjectAltName=DNS:localhost,IP:127.0.0.1" \
            -keyout "$relay/certs/default.key" -out "$relay/certs/default.crt"
          cat > "$relay/config.toml" <<'EOF'
          enable_relay = true
          http_bind_addr = "0.0.0.0:3340"
          enable_quic_addr_discovery = false
          enable_metrics = false
          [tls]
          https_bind_addr = "0.0.0.0:3443"
          cert_mode = "Manual"
          cert_dir = "/certs"
          EOF
          # Throwaway key: readable regardless of the container uid.
          chmod 755 "$relay/certs"
          chmod 644 "$relay/certs/default.crt" "$relay/certs/default.key" "$relay/config.toml"
          docker run -d --name iroh-relay -p 127.0.0.1:3443:3443 \
            -v "$relay/certs:/certs:ro" \
            -v "$relay/config.toml:/config.toml:ro" \
            n0computer/iroh-relay:v1.4.1 --config-path /config.toml
          ok=0
          for _ in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Running}}' iroh-relay)" = true ] || break
            if curl -fsk https://127.0.0.1:3443/healthz >/dev/null; then ok=1; break; fi
            sleep 2
          done
          [ "$ok" = 1 ] || { docker ps -a; docker logs iroh-relay; exit 1; }
      - name: Relay e2e (self-hosted relay)
        if: ${{ !cancelled() && matrix.name == 'linux' }}
        env:
          IROH_TUNNEL_TEST_RELAY_URL: https://127.0.0.1:3443
        run: cargo test --workspace --all-features --locked --test serve_access_tunnel -- --ignored --test-threads=1
      - name: Stop relay
        if: ${{ always() && matrix.name == 'linux' }}
        shell: bash
        run: |
          docker logs iroh-relay || true
          docker rm -f iroh-relay || true

      # --- GitHub Actions, run from the checkout with binaries built here ---
      - name: Build action binaries
        shell: bash
        run: |
          cargo build --release --locked --bin iroh-tunnel-serve --bin iroh-tunnel-access
          echo "IROH_TUNNEL_ACTION_BIN_DIR=$GITHUB_WORKSPACE/target/release" >> "$GITHUB_ENV"
      - name: Upload action binaries
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: action-bins
          path: |
            target/release/iroh-tunnel-serve
            target/release/iroh-tunnel-access
          if-no-files-found: error
          retention-days: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Start echo server
        shell: bash
        run: |
          nohup bun action-src/scripts/echo-server.ts 18080 > "$RUNNER_TEMP/echo1.log" 2>&1 &
          bun action-src/scripts/wait-port.ts 127.0.0.1:18080
      - id: serve1
        uses: ./serve
        with:
          name: echo
          target: 127.0.0.1:18080
      - uses: ./
        with:
          name: echo
          node-id: ${{ steps.serve1.outputs.node-id }}
          listen: 127.0.0.1:19080
      - name: Round trip (root path)
        shell: bash
        run: bun action-src/scripts/roundtrip.ts 127.0.0.1:19080 "hello-$RUNNER_OS"
      # Linux and macOS: a second Serve/Access pair, the `access` alias path.
      - name: Start second echo server
        if: matrix.name != 'windows'
        shell: bash
        run: |
          nohup bun action-src/scripts/echo-server.ts 18081 > "$RUNNER_TEMP/echo2.log" 2>&1 &
          bun action-src/scripts/wait-port.ts 127.0.0.1:18081
      - id: serve2
        if: matrix.name != 'windows'
        uses: ./serve
        with:
          name: echo2
          target: 127.0.0.1:18081
      - name: Access (alias path)
        if: matrix.name != 'windows'
        uses: ./access
        with:
          name: echo2
          node-id: ${{ steps.serve2.outputs.node-id }}
          listen: 127.0.0.1:19081
      - name: Round trip (alias path and root path)
        if: matrix.name != 'windows'
        shell: bash
        run: |
          bun action-src/scripts/roundtrip.ts 127.0.0.1:19081 "alias-$RUNNER_OS"
          bun action-src/scripts/roundtrip.ts 127.0.0.1:19080 "root-$RUNNER_OS"
      - name: Node ids differ
        if: matrix.name != 'windows'
        shell: bash
        env:
          A: ${{ steps.serve1.outputs.node-id }}
          B: ${{ steps.serve2.outputs.node-id }}
        run: '[ -n "$A" ] && [ -n "$B" ] && [ "$A" != "$B" ]'
      # Windows: only one Serve and one Access step per job; the second fails.
      - id: second
        name: Second Access step (expected to fail)
        if: matrix.name == 'windows'
        continue-on-error: true
        uses: ./access
        env:
          IROH_TUNNEL_ACTION_ERROR_FILE: ${{ runner.temp }}/second-error.txt
        with:
          name: echo
          node-id: ${{ steps.serve1.outputs.node-id }}
          listen: 127.0.0.1:19082
      - name: Assert second Access step failed for the right reason
        if: matrix.name == 'windows'
        shell: bash
        env:
          OUTCOME: ${{ steps.second.outcome }}
          ERROR_FILE: ${{ runner.temp }}/second-error.txt
        run: |
          [ "$OUTCOME" = failure ] || { echo "second step outcome: $OUTCOME"; exit 1; }
          cat "$ERROR_FILE"
          grep -q 'one Serve and one Access step per job on Windows' "$ERROR_FILE"
      - name: Echo server logs
        if: failure()
        shell: bash
        run: tail -n +1 "$RUNNER_TEMP"/echo*.log || true

  # The Serve action inside a container job, with a service-container hostname target.
  e2e-action-container:
    name: e2e (action in container)
    needs: e2e
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    services:
      web:
        image: nginx:alpine
    steps:
      - name: Install tools
        shell: bash
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: action-bins
          path: bins
      - name: Prepare binaries
        shell: bash
        run: |
          chmod +x bins/*
          echo "IROH_TUNNEL_ACTION_BIN_DIR=$GITHUB_WORKSPACE/bins" >> "$GITHUB_ENV"
      - id: web
        uses: ./serve
        with:
          name: web
          target: web:80
      - uses: ./
        with:
          name: web
          node-id: ${{ steps.web.outputs.node-id }}
          listen: 127.0.0.1:18090
      - name: Fetch nginx through the tunnel
        shell: bash
        run: curl -fsS http://127.0.0.1:18090/ | grep -q 'Welcome to nginx'

  e2e-ok:
    name: ${{ github.event_name == 'workflow_dispatch' && 'e2e-ok (manual)' || 'e2e-ok' }}
    if: always()
    needs: [e2e, e2e-action-container]
    runs-on: ubuntu-latest
    steps:
      # `e2e` can only be success, failure or cancelled here;
      # `failure` / `cancelled` fail the check.
      - name: Verify upstream results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
