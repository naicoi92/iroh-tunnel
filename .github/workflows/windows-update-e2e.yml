# Windows evidence for `update` (#95): zip layout and a locked running
# executable, on x64 and ARM64. Prints the OS error (--nocapture).
#   gh workflow run windows-update-e2e.yml --ref <branch>

name: windows-update-e2e

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "crates/host/**"
      - "crates/engine/**"
      - "tests/update_zip_windows.rs"
      - ".github/workflows/windows-update-e2e.yml"

concurrency:
  group: windows-update-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: e2e (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: windows-update-e2e
      - name: Update on Windows
        shell: pwsh
        run: |
          "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          cargo test --all-features --locked --test update_zip_windows -- --nocapture --test-threads=1
