# Seeds the Rust build caches that PR jobs restore from.
#
# GitHub scopes caches by ref: a PR can read main's cache but not another PR's.
# This workflow only compiles (never runs tests) on main, warming the lint,
# unit and e2e caches on Linux, macOS and Windows with the same cache keys and
# test selectors as ci.yml, so PRs start from a warm target/. It runs only when
# dependencies or the toolchain/cache setup change.

name: cache

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "crates/*/Cargo.toml"
      - "Cargo.lock"
      - ".github/actions/setup-rust/**"
      - ".github/workflows/cache.yml"

concurrency:
  group: cache
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: cache (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
          cache-key: lint
      - run: cargo clippy --workspace --all-targets --all-features --locked

  build:
    name: cache (${{ matrix.kind }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        kind: [unit, e2e]
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: ${{ matrix.kind }}
      # Doctests are compiled at test time, so they need no warm-up.
      - if: matrix.kind == 'unit'
        run: cargo test --workspace --all-features --locked --lib --bins --no-run
      - if: matrix.kind == 'e2e'
        run: cargo test --workspace --all-features --locked --test '*' --no-run
