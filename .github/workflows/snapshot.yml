# Snapshot pipeline — CI-only builds on push to main, never publishes (ADR-0002).
#
# Runs `goreleaser release --snapshot --clean` for both Linux and macOS IN
# PARALLEL (no dependency between the two jobs), which builds all artifacts into
# dist/ WITHOUT publishing. This catches iroh crate breakage and config
# regressions early (ADR-0002 §5 risk), before a real tag.
#
# Pull-request checks (fmt/clippy/test) live in ci.yml. Real releases on tag
# pushes live in release.yml.

name: snapshot

on:
  push:
    branches:
      - main
  # Release-config changes are rehearsed before merge.
  pull_request:
    paths:
      - ".goreleaser*.yaml"
      - "packaging/**"
      - ".github/workflows/snapshot.yml"
      - ".github/workflows/release.yml"

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Linux snapshot: linux/amd64 + linux/arm64 binaries (glibc + musl) +
  # Docker + deb (glibc) + apk (musl).
  # ---------------------------------------------------------------------------
  snapshot-linux:
    name: snapshot (linux)
    runs-on: ubuntu-latest
    env:
      # sccache caches compilation output across snapshot runs (cargo-zigbuild
      # invokes rustc, which honors RUSTC_WRAPPER). Job-level so the GoReleaser
      # `before.hooks` + zigbuild builds are both covered.
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain (pinned to rust-version)
        # `rustfmt` is needed because GoReleaser's `before.hooks` run
        # `cargo fmt -- --check`.
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt --no-self-update
          rustup default 1.91

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo +1.91 install cargo-zigbuild --locked

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: goreleaser snapshot (Linux)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Issue #94: each executable ships as its own package, archive and image.
      - name: Verify separate packages, archives and images
        run: |
          packaging/verify-dist.sh static dist
          packaging/verify-dist.sh runtime dist
          packaging/verify-dist.sh images dist

      # Issue #124: Windows x64/ARM64 role archives (cross-built here).
      - name: Verify Windows role archives
        run: packaging/verify-dist.sh windows dist

      - name: Upload Windows archives
        uses: actions/upload-artifact@v5
        with:
          name: windows-archives
          path: |
            dist/*-windows-*.zip
            dist/checksums.txt
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS snapshot: darwin/arm64 binary + Homebrew cask config.
  # ---------------------------------------------------------------------------
  snapshot-macos:
    name: snapshot (macos)
    runs-on: macos-14
    env:
      # NOTE: no sccache here on purpose. cargo-zigbuild's zigcc wrapper on
      # macOS is not a compiler sccache can drive (cc-rs prepends sccache
      # because RUSTC_WRAPPER is inherited, and it rejects the wrapper script
      # with "Compiler not supported"), which broke the ring build. The Linux
      # jobs keep sccache — verified green there.
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain (pinned to rust-version)
        run: |
          rustup toolchain install 1.91 --profile minimal -c rustfmt --no-self-update
          rustup default 1.91

      - name: Rust cache
        uses: Swatinem/rust-cache@v2


      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        run: cargo +1.91 install cargo-zigbuild --locked

      - name: goreleaser snapshot (macOS)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --snapshot --clean --config .goreleaser.macos.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Issue #124: macOS arm64 role archives; runs each role on this host.
      - name: Verify macOS role archives
        run: packaging/verify-dist.sh macos dist

  # ---------------------------------------------------------------------------
  # Windows runtime (issue #124): run the cross-built role binaries on real
  # Windows x64 and ARM64 runners. Verifies the archive digest, then each
  # executable starts and prints its help. This is start-up evidence only; it
  # does not forward bytes.
  # ---------------------------------------------------------------------------
  windows-runtime:
    name: windows runtime (${{ matrix.arch }})
    needs: snapshot-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: windows-archives
          path: dist

      - name: Verify digest, extract and run each role
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
          $sums = Get-Content dist/checksums.txt
          foreach ($role in 'iroh-tunnel','iroh-tunnel-serve','iroh-tunnel-access') {
            $zip = Get-ChildItem dist -Filter "$role-*-windows-$env:ARCH.zip" |
              Where-Object { $_.Name -match "^$role-\d" } | Select-Object -First 1
            if (-not $zip) { throw "no $role archive for $env:ARCH" }
            $want = ($sums | Where-Object { $_ -match [regex]::Escape($zip.Name) }) -split '\s+' | Select-Object -First 1
            $got = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLower()
            if ($want -ne $got) { throw "$($zip.Name): digest $got differs from $want" }
            $out = "run/$role"
            Expand-Archive $zip.FullName -DestinationPath $out
            $help = & "$out/$role.exe" --help
            if ($LASTEXITCODE -ne 0) { throw "$role --help exited $LASTEXITCODE" }
            Write-Host "ok: $($zip.Name) runs on $env:PROCESSOR_ARCHITECTURE`n$($help | Select-Object -First 1)"
          }
