# Post-merge pipeline — runs on push to main and on demand. Never publishes.
#
#   checks (fmt ∥ clippy ∥ test)  ┐ independent, in parallel
#   build (6 native targets ∥) ─┬─ package (nFPM + verify-dist.sh)  ┐ in parallel
#                               └─ docker  (3 images, not pushed)   ┘
#
# Why it exists:
#   - Verifies the merged result (PRs are checked against an older main).
#   - Is the only job that WRITES the Rust caches (see .github/actions/setup-rust);
#     PRs and release tags restore from them, so the build caches stay warm.
#   - Rehearses the whole release before a tag, catching target breakage early.
#
# Triggers:
#   - push to main, skipping commits that only touch docs / metadata.
#   - workflow_dispatch: rehearse the release build on any branch before merging.
#
# PR feedback lives in ci.yml; real releases (tag v*) in release.yml.

name: snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "install.sh"
      - "packaging/**"
      - "Dockerfile.goreleaser*"
      - ".github/workflows/**"
      - ".github/actions/**"

# Never cancel a main run mid-way: an interrupted run leaves the caches cold.
# Runs for the same ref queue up and only the newest pending one is kept.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      windows: true

  build:
    uses: ./.github/workflows/build.yml

  # package and docker only need the build artifacts: they run in parallel.
  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.build.outputs.version }}

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      push: false
      version: ${{ needs.build.outputs.version }}
