# Release rehearsal — builds every release artifact, publishes nothing.
#
#   build (6 native targets ∥) ─┬─ package (nFPM + verify-dist.sh)  ┐ in parallel
#                               └─ docker  (3 images, not pushed)   ┘
#
# fmt / clippy / tests are NOT repeated here: they already passed on the PR
# (ci.yml). Only what a PR does not exercise runs, and only when something that
# can break the release changed.
#
# Triggers:
#   - push to main touching dependencies, build script, packaging or the build
#     workflows. Ordinary source changes do not trigger it.
#   - workflow_dispatch: rehearse the release on any branch before merging
#     (`gh workflow run snapshot.yml --ref <branch>`).

name: snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "packaging/**"
      - "Dockerfile.goreleaser*"
      - ".github/workflows/build.yml"
      - ".github/workflows/package.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/snapshot.yml"
      - ".github/actions/**"

# A newer push supersedes a rehearsal that is still running.
concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.build.outputs.version }}

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      push: false
      version: ${{ needs.build.outputs.version }}
