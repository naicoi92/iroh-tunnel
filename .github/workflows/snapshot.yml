# Snapshot — full release rehearsal (native build matrix + deb/apk + Docker
# image build) WITHOUT publishing anything.
#
# Triggers (deliberately narrow — the heavy matrix is not run on every push):
#   - workflow_dispatch: run it by hand against any ref.
#   - push to main touching files that can break the release build. Ordinary
#     source changes are already covered by ci.yml (checks + cache warm-up),
#     and PRs touching these same paths run the same matrix via ci.yml's
#     `build-check` before merge.

name: snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "packaging/**"
      - "Dockerfile.goreleaser*"
      - ".github/workflows/build.yml"
      - ".github/workflows/package.yml"
      - ".github/workflows/docker.yml"
      - ".github/workflows/snapshot.yml"
      - ".github/actions/**"

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  # package and docker only need the build artifacts: they run in parallel.
  package:
    needs: build
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.build.outputs.version }}

  docker:
    needs: build
    uses: ./.github/workflows/docker.yml
    with:
      push: false
      version: ${{ needs.build.outputs.version }}
