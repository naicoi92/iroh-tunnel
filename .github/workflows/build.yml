# Reusable native build + packaging. Called by ci.yml (rehearsal), snapshot.yml
# (manual) and release.yml (tag). Replaces the GoReleaser build stage.
#
# Every target builds on its OWN runner IN PARALLEL, natively where a native
# runner exists (no zig, no QEMU, no cross toolchain):
#
#   gnu-amd64     ubuntu-22.04      x86_64-unknown-linux-gnu      (glibc >= 2.35)
#   gnu-arm64     ubuntu-22.04-arm  aarch64-unknown-linux-gnu
#   musl-amd64    ubuntu-latest     x86_64-unknown-linux-musl     (static, Alpine)
#   musl-arm64    ubuntu-24.04-arm  aarch64-unknown-linux-musl
#   musl-riscv64  ubuntu-latest     riscv64gc-unknown-linux-musl  (cargo-zigbuild:
#                                   no native runner exists; NanoKVM / buildroot)
#   darwin-arm64  macos-14          aarch64-apple-darwin
#   windows-amd64 windows-latest    x86_64-pc-windows-msvc        (.zip)
#   windows-arm64 windows-11-arm    aarch64-pc-windows-msvc       (.zip)
#
# Every target builds all three executables (iroh-tunnel, iroh-tunnel-serve,
# iroh-tunnel-access) in ONE cargo invocation (issue #124). The smoke test runs
# each of them on its own native runner, so Windows x64 / ARM64 and macOS arm64
# start-up is exercised here, not only cross-built. Unsigned (signing is #100).
# Packaging (package.yml) and the Docker images (docker.yml) consume the
# artifacts and run in parallel with each other.
#
# Artifacts:
#   target-<id>   one release archive per executable (.tar.gz; .zip on
#                 Windows) and, on Unix targets, the raw executables

name: build

on:
  workflow_call:
    outputs:
      version:
        description: App version (tag without leading v, else <Cargo version>-dev).
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Mirrors build.rs (ADR-0003): HEAD on a tag vX.Y.Z -> X.Y.Z, otherwise
      # <CARGO_PKG_VERSION>-dev, so file names always match `--version`.
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.id }})
    needs: version
    runs-on: ${{ matrix.runner }}
    # The steps below are bash; Windows runners default to PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      # One broken target fails the whole build, so stop the siblings instead of
      # burning runner minutes on a build that cannot be used.
      fail-fast: true
      matrix:
        include:
          - { id: gnu-amd64,     runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,      os: linux,  arch: amd64,   suffix: "" }
          - { id: gnu-arm64,     runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu,     os: linux,  arch: arm64,   suffix: "" }
          - { id: musl-amd64,    runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,     os: linux,  arch: amd64,   suffix: "-musl", musl: true }
          - { id: musl-arm64,    runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,    os: linux,  arch: arm64,   suffix: "-musl", musl: true }
          - { id: musl-riscv64,  runner: ubuntu-latest,    target: riscv64gc-unknown-linux-musl,  os: linux,  arch: riscv64gc, suffix: "-musl", zig: true }
          - { id: darwin-arm64,  runner: macos-14,         target: aarch64-apple-darwin,          os: darwin, arch: arm64,   suffix: "" }
          - { id: windows-amd64, runner: windows-latest,   target: x86_64-pc-windows-msvc,        os: windows, arch: amd64,  suffix: "", ext: ".exe" }
          - { id: windows-arm64, runner: windows-11-arm,   target: aarch64-pc-windows-msvc,       os: windows, arch: arm64,  suffix: "", ext: ".exe" }
    env:
      # Statically link PCRE2 for the `regex` crate so binaries are portable
      # across distros without a libpcre2 shared library at runtime.
      PCRE2_SYS_STATIC: "1"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Full history: build.rs resolves APP_VERSION via `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: build-${{ matrix.id }}

      - name: Install musl toolchain
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          # cc-rs (C deps such as ring) and the final link must both use musl.
          key="${TARGET//-/_}"
          echo "CC_${key}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${key^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = "true" ]; then sub=zigbuild; else sub=build; fi
          cargo "$sub" --release --locked --target "$TARGET" --bins

      - name: Smoke test (native binaries)
        if: ${{ !matrix.zig }}
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH"
          out="$("target/$TARGET/release/iroh-tunnel${EXT}" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || { echo "version mismatch: expected $VERSION"; exit 1; }
          for b in iroh-tunnel iroh-tunnel-serve iroh-tunnel-access; do
            "target/$TARGET/release/${b}${EXT}" --help >/dev/null
            echo "ok: $b starts on $RUNNER_OS $RUNNER_ARCH"
          done

      # One tarball per executable (issue #94); each holds only that binary.
      - name: Archive
        if: matrix.os != 'windows'
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p out
          for b in iroh-tunnel iroh-tunnel-serve iroh-tunnel-access; do
            cp "target/$TARGET/release/$b" "out/$b"
            tar -czf "out/${b}-${VERSION}-${OS}-${ARCH}${SUFFIX}.tar.gz" \
              -C out "$b" -C .. README.md LICENSE-APACHE LICENSE-MIT
          done

      # One .zip per executable (issue #124), holding only that .exe plus the
      # README and licenses, flat (no directory inside).
      - name: Archive (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force out | Out-Null
          foreach ($b in 'iroh-tunnel','iroh-tunnel-serve','iroh-tunnel-access') {
            $stage = "stage/$b"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "target/$env:TARGET/release/$b.exe" $stage
            Copy-Item README.md,LICENSE-APACHE,LICENSE-MIT $stage
            Compress-Archive -Path "$stage/*" -DestinationPath "out/$b-$env:VERSION-windows-$env:ARCH.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.id }}
          path: out/
          if-no-files-found: error
          retention-days: 7
