# Reusable native build + packaging. Called by ci.yml (rehearsal), snapshot.yml
# (manual) and release.yml (tag). Replaces the GoReleaser build stage.
#
# Every target builds on its OWN runner IN PARALLEL, natively where a native
# runner exists (no zig, no QEMU, no cross toolchain):
#
#   gnu-amd64     ubuntu-22.04      x86_64-unknown-linux-gnu      (glibc >= 2.35)
#   gnu-arm64     ubuntu-22.04-arm  aarch64-unknown-linux-gnu
#   musl-amd64    ubuntu-latest     x86_64-unknown-linux-musl     (static, Alpine)
#   musl-arm64    ubuntu-24.04-arm  aarch64-unknown-linux-musl
#   musl-riscv64  ubuntu-latest     riscv64gc-unknown-linux-musl  (cargo-zigbuild:
#                                   no native runner exists; NanoKVM / buildroot)
#   darwin-arm64  macos-14          aarch64-apple-darwin
#
# `package` then wraps the glibc binaries into .deb and the musl binaries into
# .apk with standalone nFPM, reusing packaging/nfpm.yaml.
#
# Artifacts (consumed by docker.yml and release.yml):
#   target-<id>   iroh-tunnel binary + release tarball for that target
#   packages      *.deb + *.apk

name: build

on:
  workflow_call:
    outputs:
      version:
        description: App version (tag without leading v, else <Cargo version>-dev).
        value: ${{ jobs.version.outputs.version }}

permissions:
  contents: read

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Mirrors build.rs (ADR-0003): HEAD on a tag vX.Y.Z -> X.Y.Z, otherwise
      # <CARGO_PKG_VERSION>-dev, so file names always match `--version`.
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)-dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.id }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: gnu-amd64,     runner: ubuntu-22.04,     target: x86_64-unknown-linux-gnu,      os: linux,  arch: amd64,   suffix: "" }
          - { id: gnu-arm64,     runner: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu,     os: linux,  arch: arm64,   suffix: "" }
          - { id: musl-amd64,    runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,     os: linux,  arch: amd64,   suffix: "-musl", musl: true }
          - { id: musl-arm64,    runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl,    os: linux,  arch: arm64,   suffix: "-musl", musl: true }
          - { id: musl-riscv64,  runner: ubuntu-latest,    target: riscv64gc-unknown-linux-musl,  os: linux,  arch: riscv64, suffix: "-musl", zig: true }
          - { id: darwin-arm64,  runner: macos-14,         target: aarch64-apple-darwin,          os: darwin, arch: arm64,   suffix: "" }
    env:
      # Statically link PCRE2 for the `regex` crate so binaries are portable
      # across distros without a libpcre2 shared library at runtime.
      PCRE2_SYS_STATIC: "1"
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # Full history: build.rs resolves APP_VERSION via `git describe`.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          targets: ${{ matrix.target }}
          cache-key: build-${{ matrix.id }}

      - name: Install musl toolchain
        if: matrix.musl
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools
          # cc-rs (C deps such as ring) and the final link must both use musl.
          key="${TARGET//-/_}"
          echo "CC_${key}=musl-gcc" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_${key^^}_LINKER=musl-gcc" >> "$GITHUB_ENV"

      - name: Install zig + cargo-zigbuild
        if: matrix.zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        if: matrix.zig
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          ZIG: ${{ matrix.zig }}
        run: |
          if [ "$ZIG" = "true" ]; then sub=zigbuild; else sub=build; fi
          cargo "$sub" --release --locked --target "$TARGET"

      - name: Smoke test (native binaries)
        if: ${{ !matrix.zig }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          out="$("target/$TARGET/release/iroh-tunnel" --version)"
          echo "$out"
          [[ "$out" == *"$VERSION"* ]] || { echo "version mismatch: expected $VERSION"; exit 1; }

      - name: Archive
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          mkdir -p out
          cp "target/$TARGET/release/iroh-tunnel" out/iroh-tunnel
          tar -czf "out/iroh-tunnel-${VERSION}-${OS}-${ARCH}${SUFFIX}.tar.gz" \
            -C out iroh-tunnel \
            -C .. README.md LICENSE-APACHE LICENSE-MIT

      - uses: actions/upload-artifact@v4
        with:
          name: target-${{ matrix.id }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  package:
    name: package (deb + apk)
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          pattern: target-*
          path: in/

      - name: Install nFPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo goreleaser/nfpm --pattern 'nfpm_*_Linux_x86_64.tar.gz' --dir /tmp/nfpm
          tar -xzf /tmp/nfpm/nfpm_*_Linux_x86_64.tar.gz -C /tmp/nfpm nfpm
          sudo install /tmp/nfpm/nfpm /usr/local/bin/nfpm

      # .deb from glibc builds (Debian/Ubuntu); .apk from musl builds (Alpine).
      - name: Build packages
        run: |
          mkdir -p packages
          pack() { # <artifact-id> <arch> <format>
            BINARY="$PWD/in/target-$1/iroh-tunnel" ARCH="$2" \
              nfpm package --config packaging/nfpm.yaml --packager "$3" \
              --target "packages/iroh-tunnel_${VERSION}_$2.$3"
          }
          pack gnu-amd64 amd64 deb
          pack gnu-arm64 arm64 deb
          pack musl-amd64 amd64 apk
          pack musl-arm64 arm64 apk
          pack musl-riscv64 riscv64 apk
          ls -l packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: packages/
          if-no-files-found: error
          retention-days: 7
