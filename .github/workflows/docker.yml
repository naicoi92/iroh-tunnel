# Reusable multi-arch Docker image from the PREBUILT glibc binaries produced by
# build.yml. Nothing is compiled here and Dockerfile.goreleaser has no RUN
# step, so no QEMU is needed — buildx only assembles layers.
#
# push=false rehearses the build (ci.yml); push=true publishes to ghcr.io.

name: docker

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      version:
        description: App version (used for tags and labels).
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: image (linux/amd64 + linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Stage binaries at $TARGETPLATFORM/iroh-tunnel (see Dockerfile.goreleaser).
      - uses: actions/download-artifact@v4
        with:
          name: target-gnu-amd64
          path: linux/amd64
      - uses: actions/download-artifact@v4
        with:
          name: target-gnu-arm64
          path: linux/arm64

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/naicoi92/iroh-tunnel
          tags: |
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.push }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.push }}
            type=semver,pattern=v{{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.push }}
            type=semver,pattern=v{{major}},value=v${{ inputs.version }},enable=${{ inputs.push }}
            type=raw,value=latest,enable=${{ inputs.push && !contains(inputs.version, '-') }}
            type=raw,value=check,enable=${{ !inputs.push }}
          labels: |
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.goreleaser
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
