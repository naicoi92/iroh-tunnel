# Reusable multi-arch Docker images (one per executable, issue #94) from the PREBUILT glibc binaries produced by
# build.yml. Nothing is compiled here and Dockerfile.goreleaser has no RUN
# step, so no QEMU is needed — buildx only assembles layers.
#
# Rehearsal mode needs only the two glibc build artifacts, so it runs in PARALLEL
# with package.yml. Promotion mode (`release_tag` set, #141) takes the binaries
# from the signed release archives instead.
# push=false rehearses the build (ci.yml); push=true publishes to ghcr.io.

name: docker

on:
  workflow_call:
    inputs:
      push:
        type: boolean
        default: false
      version:
        description: App version (used for tags and labels).
        type: string
        required: true
      release_tag:
        description: >-
          Release tag whose published assets supply the binaries (promote.yml,
          #141). Empty: use the `target-gnu-*` artifacts of the calling run.
        type: string
        default: ''

# No `permissions:` block on purpose: a called workflow inherits its caller's
# token and can only narrow it. Rehearsal callers (ci.yml, snapshot.yml) grant
# `contents: read`; promote.yml grants `packages: write` to its calling job for
# the real push (#141). Declaring any block here would reset `packages` to none.

jobs:
  image:
    name: image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: iroh-tunnel,        dockerfile: Dockerfile.goreleaser }
          - { image: iroh-tunnel-serve,  dockerfile: Dockerfile.goreleaser.serve }
          - { image: iroh-tunnel-access, dockerfile: Dockerfile.goreleaser.access }
    steps:
      # Dockerfiles come from the tag when promoting, so they match the binaries.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      # Stage binaries at $TARGETPLATFORM/<binary> (see the Dockerfiles).
      - if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: target-gnu-amd64
          path: linux/amd64
      - if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          name: target-gnu-arm64
          path: linux/arm64

      # Promotion: the binaries are the ones inside the signed, published glibc
      # archives, checked against the signed checksums.txt.
      - name: Stage binaries from the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          VERSION: ${{ inputs.version }}
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          mkdir -p dl
          gh release download "$TAG" --dir dl --pattern checksums.txt \
            --pattern "${IMAGE}-${VERSION}-linux-amd64.tar.gz" \
            --pattern "${IMAGE}-${VERSION}-linux-arm64.tar.gz"
          for arch in amd64 arm64; do
            name="${IMAGE}-${VERSION}-linux-${arch}.tar.gz"
            want="$(awk -v n="$name" '$2 == n { print $1 }' dl/checksums.txt)"
            [[ -n "$want" ]] || { echo "$name is not in checksums.txt" >&2; exit 1; }
            echo "$want  dl/$name" | sha256sum -c -
            mkdir -p "linux/$arch"
            tar -xzf "dl/$name" -C "linux/$arch" "$IMAGE"
          done

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/naicoi92/${{ matrix.image }}
          tags: |
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.push }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.push }}
            type=semver,pattern=v{{major}}.{{minor}},value=v${{ inputs.version }},enable=${{ inputs.push }}
            type=semver,pattern=v{{major}},value=v${{ inputs.version }},enable=${{ inputs.push }}
            type=raw,value=latest,enable=${{ inputs.push && !contains(inputs.version, '-') }}
            type=raw,value=check,enable=${{ !inputs.push }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.version=${{ inputs.version }}

      - name: Build${{ inputs.push && ' and push' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false

      # Immutable image identifier, recorded as evidence (#141).
      - name: Record image digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: echo "ghcr.io/naicoi92/${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
